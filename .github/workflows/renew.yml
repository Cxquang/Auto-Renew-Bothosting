name: Auto Renew Bot-hosting

on:
  #schedule:
  #  - cron: '30 22 * * *' # 每天UTC 1点 (北京时间9点, 一般都会推迟),自行根据服务到期时间调整
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04

    env:
      # 可选: 外部住宅代理(b2proxy 等), 格式 user:pass@host:port 或 http://user:pass@host:port
      # 配置后优先使用它, 不再启动 sing-box
      RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY }}
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: 🔍 代理线路连通性检测 (临时)
        run: |
          if [ -z "$RESIDENTIAL_PROXY" ]; then
            echo "❌ RESIDENTIAL_PROXY 未配置"
            exit 0
          fi
          case "$RESIDENTIAL_PROXY" in
            http://*|https://*|socks5://*|socks5h://*) PURL="$RESIDENTIAL_PROXY" ;;
            *) PURL="http://$RESIDENTIAL_PROXY" ;;
          esac
          echo "✅ 已读取 RESIDENTIAL_PROXY (长度: ${#RESIDENTIAL_PROXY})"
          echo "---------- 1) 出口 IP ----------"
          curl -sS -x "$PURL" --max-time 30 https://api.ip.sb/ip || echo "❌ 出口 IP 获取失败"
          echo "---------- 2) challenges.cloudflare.com (Turnstile api.js) ----------"
          curl -x "$PURL" -sS -o /tmp/ts_api.js \
            -w "http_code=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s size=%{size_download}\n" \
            --max-time 40 "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" \
            || echo "❌ 请求失败(超时/被拦截)"
          echo "内容开头: $(head -c 100 /tmp/ts_api.js 2>/dev/null)"
          echo "---------- 3) bot-hosting.net 登录页 ----------"
          curl -x "$PURL" -sS -o /dev/null \
            -w "http_code=%{http_code} total=%{time_total}s\n" \
            --max-time 40 https://bot-hosting.net/login || echo "❌ 请求失败(超时/被拦截)"
          echo "---------- 4) Cloudflare trace ----------"
          curl -x "$PURL" -sS --max-time 30 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|loc|colo)=" || echo "❌ 请求失败"

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests pysocks
          seleniumbase install chromedriver

      - name: 🌐 使用外部住宅代理 (可选)
        if: env.RESIDENTIAL_PROXY != ''
        run: |
          echo "IS_PROXY=true" >> "$GITHUB_ENV"
          echo "PROXY_SERVER=$RESIDENTIAL_PROXY" >> "$GITHUB_ENV"
          echo "✅ 已启用外部住宅代理(优先于 sing-box)"

      - name: ⚙ 设置代理 (sing-box)
        id: proxy
        if: env.RESIDENTIAL_PROXY == ''
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          # setup_proxy.sh 把 hysteria2 链接里的 obfs= 当作密码，
          # 但标准分享链接是 obfs=<混淆类型>&obfs-password=<密码>，
          # 直接传入会导致 obfs 密码错误、QUIC 握手超时。
          # 这里把链接改写为脚本能识别的形式：obfs=<密码>，并移除 obfs-password。
          if [[ "$NODE_LINK" == hysteria2://* || "$NODE_LINK" == hy2://* ]] && [[ "$NODE_LINK" == *"obfs-password="* ]]; then
            obfs_pwd=$(printf '%s' "$NODE_LINK" | sed -n 's/.*[?&]obfs-password=\([^&#]*\).*/\1/p')
            if [ -n "$obfs_pwd" ]; then
              obfs_pwd=$(printf '%b' "${obfs_pwd//%/\\x}")  # URL 解码
              base="${NODE_LINK%%\?*}"
              query="${NODE_LINK#*\?}"
              if [ "$query" = "$NODE_LINK" ]; then query=""; fi
              fragment=""
              if [[ "$query" == *"#"* ]]; then
                fragment="#${query#*#}"
                query="${query%%#*}"
              fi
              new_query=""
              IFS='&' read -ra parts <<< "$query"
              for part in "${parts[@]}"; do
                case "$part" in
                  obfs=*|obfs-password=*) ;;
                  *) new_query+="${part}&" ;;
                esac
              done
              export NODE_LINK="${base}?${new_query}obfs=${obfs_pwd}${fragment}"
              echo "[INFO] 已修正 hysteria2 obfs 密码参数"
            fi
          fi
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🔁 代理连接复测 (首次失败时)
        if: steps.proxy.outcome == 'failure'
        run: |
          echo "⚠️ 代理首次检测失败，使用更长超时复测..."
          ip=$(curl -x socks5://127.0.0.1:1080 -s --max-time 30 https://api.ipify.org || true)
          if [ -n "$ip" ]; then
            echo "✅ 代理复测通过，出口IP: $ip"
            echo "IS_PROXY=true" >> "$GITHUB_ENV"
            echo "PROXY_SERVER=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
          else
            echo "❌ 代理复测仍失败，本次改为直连访问"
            echo "---- sing-box 日志(末尾) ----"
            tail -n 40 sing-box.log 2>/dev/null || true
          fi

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          #TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          #TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MP_URL: ${{ secrets.MP_URL }}
          MP_APIKEY: ${{ secrets.MP_APIKEY }}
          MP_CHANNEL: ${{ secrets.MP_CHANNEL }}
          MP_MTYPE: ${{ secrets.MP_MTYPE }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
